<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Asset Vault 应用图标</title>
  <desc id="desc">靛蓝色圆角方形中，白色字母 A 构成保险库门，中央锁孔表达本地加密保护。</desc>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#4F46E5"/>
  <!-- 圆角边框在大尺寸下增加层次，小尺寸时自然隐去 -->
  <rect x="58" y="58" width="908" height="908" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <!-- A 的两笔同时是保险库门的左右门柱 -->
  <path d="M294 742 L430 320 Q512 202 594 320 L730 742"
        fill="none" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 加宽的门闩兼作 A 的横画 -->
  <path d="M385 584 H639" fill="none" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round"/>
  <!-- 锁孔落在 A 的负空间中，并与横画相连，缩小时仍是一个整体 -->
  <circle cx="512" cy="466" r="58" fill="#FFFFFF"/>
  <path d="M482 510 L458 584 H566 L542 510 Z" fill="#FFFFFF"/>
</svg>
